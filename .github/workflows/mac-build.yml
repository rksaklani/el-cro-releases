name: macOS build (.dmg)

# Builds the macOS .dmg files (Apple silicon + Intel) and attaches them to a release in
# THIS repo. Runs here because this repo is public (free macOS runners); the source code
# lives in the private repo rksaklani/el-cro-browser and is fetched with the CODE_TOKEN
# secret (read access to that repo). Logs are public — never print tokens or source.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0) — must exist in el-cro-browser AND have a release here'
        required: true

permissions:
  contents: write

jobs:
  dmg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout El-cro source (private repo, release tag)
        uses: actions/checkout@v4
        with:
          repository: rksaklani/el-cro-browser
          ref: ${{ inputs.tag }}
          token: ${{ secrets.CODE_TOKEN }}
          persist-credentials: false

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch git dependencies over HTTPS (not SSH)
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Download Electron (castLabs)
        run: node node_modules/electron/install.js

      - name: Build (renderer + main)
        run: npm run build

      - name: Build .dmg (${{ matrix.arch }})
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx --yes electron-builder --mac dmg --${{ matrix.arch }} --publish never

      - name: Attach the .dmg to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          ls -l release/*.dmg
          gh release upload "$TAG" release/*.dmg --clobber --repo "${{ github.repository }}"
